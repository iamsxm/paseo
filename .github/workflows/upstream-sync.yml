name: Sync upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge official upstream
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git || true
          git fetch upstream --prune
          git checkout master
          git merge --no-edit upstream/master
          git push origin master
