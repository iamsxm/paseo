name: Sync Upstream (PR)

on:
  schedule:
    - cron: "30 2 * * *" # 每天 UTC 02:30 自动检查一次
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "UPSTREAM_SYNC_TOKEN is not configured. Add a fine-grained token with Contents, Workflows, and Pull requests write permissions."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check and sync upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git || true
          git fetch upstream main --prune

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream has $BEHIND_COUNT commits ahead of $TARGET_BRANCH."

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Already up to date with official upstream."
            exit 0
          fi

          BRANCH_NAME="sync/upstream-main"
          git checkout -B "$BRANCH_NAME" "$TARGET_BRANCH"

          HAS_CONFLICTS=false
          if git merge upstream/main --no-edit; then
            echo "Merge succeeded cleanly."
          else
            HAS_CONFLICTS=true
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "Merge has conflicts in: $CONFLICTS"
            git commit -am "chore: resolve merge conflicts with upstream/main" || true
          fi

          git push origin "$BRANCH_NAME" --force

          if [ "$HAS_CONFLICTS" = "true" ]; then
            PR_TITLE="⚠️ [Conflict] sync official upstream (${BEHIND_COUNT} commits)"
            echo "### ⚠️ 上游同步冲突通知" > pr_body.md
            echo "" >> pr_body.md
            echo "检测到官方上游仓库 (\`getpaseo/paseo:main\`) 存在更新，自动合并时发现冲突：" >> pr_body.md
            echo "" >> pr_body.md
            echo "- **上游新增提交数**：${BEHIND_COUNT}" >> pr_body.md
            echo "- **目标分支**：\`$TARGET_BRANCH\`" >> pr_body.md
            echo "- **冲突文件**：" >> pr_body.md
            echo '```' >> pr_body.md
            echo "$CONFLICTS" >> pr_body.md
            echo '```' >> pr_body.md
            echo "" >> pr_body.md
            echo "请在本地拉取分支 \`sync/upstream-main\` 解决冲突后推送到本 PR。" >> pr_body.md
          else
            PR_TITLE="chore: sync official upstream (${BEHIND_COUNT} commits)"
            echo "### 🤖 上游同步通知" > pr_body.md
            echo "" >> pr_body.md
            echo "检测到官方上游仓库 (\`getpaseo/paseo:main\`) 存在更新。" >> pr_body.md
            echo "" >> pr_body.md
            echo "- **上游新增提交数**：${BEHIND_COUNT}" >> pr_body.md
            echo "- **目标分支**：\`$TARGET_BRANCH\`" >> pr_body.md
            echo "- **合并状态**：✅ 无冲突，可直接合入" >> pr_body.md
            echo "" >> pr_body.md
            echo "所有修改已自动合并无冲突。" >> pr_body.md
          fi

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body-file pr_body.md || {
              echo "PR already exists, updating title/body..."
              gh pr edit "$BRANCH_NAME" --title "$PR_TITLE" --body-file pr_body.md || true
            }
