name: Sync upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge official upstream
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git || true
          git fetch upstream --prune
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout codex/host-sync
          git merge --no-edit upstream/main
          git push origin HEAD:codex/host-sync
