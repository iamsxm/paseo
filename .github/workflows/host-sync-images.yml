name: Host Sync Images

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "docker/host-sync/**"
      - "patches/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig*.json"
      - ".dockerignore"
      - ".github/workflows/host-sync-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: host-sync-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: paseo-host-sync
            context: docker/host-sync
            file: docker/host-sync/Dockerfile
          - name: paseo-web
            context: .
            file: docker/host-sync/Web.Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "name=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Package image for SSH deployment
        run: gzip -1 "${RUNNER_TEMP}/image.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-linux-amd64
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 14
          compression-level: 0
