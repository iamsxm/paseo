name: paseo-host-sync
services:
  host-sync:
    image: ghcr.io/${IMAGE_OWNER:-iamsxm}/paseo-host-sync:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNC_PORT:-18090}:8090"
    volumes:
      - host-sync-data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  web:
    image: ghcr.io/${IMAGE_OWNER:-iamsxm}/paseo-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    depends_on:
      host-sync:
        condition: service_healthy
volumes:
  host-sync-data:
